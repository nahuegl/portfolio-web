<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg-sancor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060410"/>
      <stop offset="100%" style="stop-color:#0a0a10"/>
    </linearGradient>
    <linearGradient id="glowMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A70355;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#A70355;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#A70355;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A4494"/>
      <stop offset="100%" style="stop-color:#A70355"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg-sancor)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots-sancor" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="0" cy="0" r="0.7" fill="#A70355" opacity="0.12"/>
  </pattern>
  <rect width="800" height="420" fill="url(#dots-sancor)"/>

  <!-- Browser frame -->
  <rect x="50" y="40" width="540" height="340" rx="6" fill="#0a0a12" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Browser bar -->
  <rect x="50" y="40" width="540" height="32" rx="6" fill="#13132a"/>
  <rect x="50" y="56" width="540" height="16" fill="#13132a"/>
  <!-- Browser dots -->
  <circle cx="70" cy="56" r="5" fill="#A70355" opacity="0.9"/>
  <circle cx="86" cy="56" r="5" fill="#0A4494" opacity="0.7"/>
  <circle cx="102" cy="56" r="5" fill="#52606D" opacity="0.6"/>
  <!-- URL bar -->
  <rect x="120" y="49" width="360" height="14" rx="7" fill="#1a1a2e"/>
  <text x="135" y="60" font-family="monospace" font-size="8" fill="#A70355" opacity="0.8">sancor-seguros-redesign.vercel.app</text>

  <!-- Nav Sancor -->
  <rect x="50" y="72" width="540" height="44" fill="#FFFFFF"/>
  <!-- Logo area -->
  <rect x="68" y="82" width="8" height="8" rx="1" fill="#A70355"/>
  <rect x="78" y="82" width="8" height="8" rx="1" fill="#0A4494"/>
  <text x="92" y="91" font-family="sans-serif" font-size="10" font-weight="700" fill="#0A4494">SANCOR</text>
  <text x="148" y="91" font-family="sans-serif" font-size="7" fill="#A70355" font-weight="600">SEGUROS</text>
  <text x="380" y="99" font-family="sans-serif" font-size="8" fill="#52606D">Seguros</text>
  <text x="420" y="99" font-family="sans-serif" font-size="8" fill="#52606D">Empresas</text>
  <text x="464" y="99" font-family="sans-serif" font-size="8" fill="#52606D">Contacto</text>
  <rect x="506" y="85" width="70" height="22" rx="11" fill="#A70355"/>
  <text x="541" y="100" font-family="sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="600">Cotizá ahora</text>

  <!-- Hero with gradient -->
  <rect x="50" y="116" width="540" height="152" fill="url(#heroGrad)" opacity="0.92"/>
  <!-- Overlay subtle -->
  <rect x="50" y="116" width="540" height="152" fill="#000000" opacity="0.35"/>
  <!-- Decorative circle -->
  <circle cx="490" cy="192" r="90" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="490" cy="192" r="60" fill="#FFFFFF" opacity="0.04"/>
  <!-- Hero content -->
  <text x="80" y="158" font-family="sans-serif" font-size="9" fill="#FFFFFF" opacity="0.6" font-weight="500" letter-spacing="3">SEGUROS PARA CADA ETAPA</text>
  <text x="80" y="184" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Tu tranquilidad,</text>
  <text x="80" y="208" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">nuestra <tspan fill="#A70355">prioridad.</tspan></text>
  <rect x="80" y="220" width="240" height="2" fill="#FFFFFF" opacity="0.15"/>
  <!-- CTA button pill -->
  <rect x="80" y="232" width="110" height="28" rx="14" fill="#A70355"/>
  <text x="135" y="250" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="600">Cotizá tu seguro</text>
  <rect x="202" y="232" width="90" height="28" rx="14" fill="transparent" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4"/>
  <text x="247" y="250" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" opacity="0.7">Ver coberturas</text>

  <!-- Cards row -->
  <rect x="50" y="268" width="540" height="84" fill="#F8F8F8"/>
  <!-- Card 1 -->
  <rect x="62" y="278" width="160" height="62" rx="12" fill="#FFFFFF" stroke="#C4C9CD" stroke-width="0.5"/>
  <rect x="74" y="288" width="24" height="24" rx="12" fill="#A70355" opacity="0.12"/>
  <text x="86" y="305" font-family="sans-serif" font-size="10" fill="#A70355" text-anchor="middle">🚗</text>
  <text x="108" y="298" font-family="sans-serif" font-size="8" font-weight="600" fill="#0A4494">Automotor</text>
  <text x="108" y="310" font-family="sans-serif" font-size="7" fill="#52606D">Cobertura total</text>
  <!-- Card 2 -->
  <rect x="234" y="278" width="160" height="62" rx="12" fill="#FFFFFF" stroke="#C4C9CD" stroke-width="0.5"/>
  <rect x="246" y="288" width="24" height="24" rx="12" fill="#0A4494" opacity="0.12"/>
  <text x="258" y="305" font-family="sans-serif" font-size="10" fill="#0A4494" text-anchor="middle">🏠</text>
  <text x="280" y="298" font-family="sans-serif" font-size="8" font-weight="600" fill="#0A4494">Hogar</text>
  <text x="280" y="310" font-family="sans-serif" font-size="7" fill="#52606D">Protegé tu casa</text>
  <!-- Card 3 -->
  <rect x="406" y="278" width="160" height="62" rx="12" fill="#FFFFFF" stroke="#C4C9CD" stroke-width="0.5"/>
  <rect x="418" y="288" width="24" height="24" rx="12" fill="#A70355" opacity="0.12"/>
  <text x="430" y="305" font-family="sans-serif" font-size="10" fill="#A70355" text-anchor="middle">💼</text>
  <text x="452" y="298" font-family="sans-serif" font-size="8" font-weight="600" fill="#0A4494">Empresas</text>
  <text x="452" y="310" font-family="sans-serif" font-size="7" fill="#52606D">Soluciones B2B</text>

  <!-- Bottom bar -->
  <rect x="50" y="352" width="540" height="28" fill="#0a0a12"/>
  <text x="72" y="370" font-family="monospace" font-size="7" fill="#A70355" opacity="0.5">// scroll-animations · dark/light · ES / PT / EN</text>
  <rect x="390" y="360" width="38" height="10" rx="1" fill="#A70355" fill-opacity="0.1" stroke="#A70355" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="409" y="368" font-family="monospace" font-size="6" fill="#A70355" text-anchor="middle">Next.js 15</text>
  <rect x="436" y="360" width="30" height="10" rx="1" fill="#0A4494" fill-opacity="0.15" stroke="#0A4494" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="451" y="368" font-family="monospace" font-size="6" fill="#0A4494" text-anchor="middle">GSAP</text>
  <rect x="474" y="360" width="40" height="10" rx="1" fill="#A70355" fill-opacity="0.1" stroke="#A70355" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="494" y="368" font-family="monospace" font-size="6" fill="#A70355" text-anchor="middle">Framer M.</text>

  <!-- Side panel -->
  <rect x="618" y="40" width="132" height="340" rx="2" fill="#0a0a12" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="618" y="40" width="132" height="3" fill="#A70355"/>
  <text x="628" y="65" font-family="monospace" font-size="7" fill="#A70355" opacity="0.6">// Sancor Redesign</text>
  <text x="628" y="82" font-family="monospace" font-size="7" fill="#52606D">type: corporativo</text>
  <text x="628" y="96" font-family="monospace" font-size="7" fill="#52606D">stack: Next 15</text>
  <text x="628" y="110" font-family="monospace" font-size="7" fill="#A70355" opacity="0.7">motion: GSAP +FM</text>
  <text x="628" y="124" font-family="monospace" font-size="7" fill="#52606D">scroll: Lenis</text>
  <text x="628" y="138" font-family="monospace" font-size="7" fill="#0A4494" opacity="0.9">i18n: ES/PT/EN</text>
  <line x1="628" y1="150" x2="740" y2="150" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="628" y="166" font-family="monospace" font-size="6" fill="#A70355" opacity="0.4">// design tokens</text>
  <rect x="628" y="174" width="14" height="14" rx="3" fill="#A70355"/>
  <rect x="648" y="174" width="14" height="14" rx="3" fill="#0A4494"/>
  <rect x="668" y="174" width="14" height="14" rx="3" fill="#52606D"/>
  <rect x="688" y="174" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#C4C9CD" stroke-width="0.5"/>

  <!-- Glow line -->
  <rect x="0" y="209" width="800" height="1" fill="url(#glowMagenta)" opacity="0.4"/>

  <!-- Label -->
  <text x="590" y="410" font-family="monospace" font-size="9" fill="#A70355" opacity="0.4" text-anchor="end">Sancor Seguros — Next.js 15 · GSAP · Framer Motion</text>
</svg>
