<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="800" height="500" fill="#0f0a07"/>

  <!-- Top bar -->
  <rect width="800" height="44" fill="#160d07"/>
  <circle cx="20" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="22" r="5" fill="#febc2e"/>
  <circle cx="52" cy="22" r="5" fill="#28c840"/>
  <text x="80" y="27" font-size="11" fill="#D04A02" font-family="monospace" letter-spacing="2">K-1 TAX ASSISTANT</text>
  <rect x="620" y="12" width="160" height="20" rx="3" fill="#D04A02" opacity="0.15"/>
  <text x="700" y="26" font-size="9" fill="#D04A02" text-anchor="middle">Schedule K-1 (Form 1065)</text>

  <!-- Left panel — K1 Document viewer -->
  <rect x="0" y="44" width="300" height="456" fill="#110c07"/>
  <rect x="0" y="44" width="300" height="1" fill="#2a1a0a"/>

  <text x="20" y="76" font-size="10" fill="#D04A02" letter-spacing="2">K-1 DOCUMENT</text>
  <rect x="20" y="84" width="260" height="1" fill="#2a1a0a"/>

  <!-- Upload zone or document preview -->
  <rect x="20" y="94" width="260" height="180" rx="4" fill="#160d07" stroke="#2a1a0a" stroke-width="1"/>

  <!-- Simulated K1 form -->
  <text x="35" y="114" font-size="8" fill="#D04A02" letter-spacing="1">SCHEDULE K-1 (FORM 1065) — 2024</text>
  <rect x="35" y="118" width="230" height="1" fill="#2a1a0a"/>

  <text x="35" y="134" font-size="7" fill="#7a5030">Partner's Share of Income, Deductions, Credits</text>

  <!-- Box rows -->
  <rect x="35" y="142" width="110" height="16" rx="2" fill="#1a1007"/>
  <text x="40" y="154" font-size="7" fill="#D04A02">Box 1 — Ordinary income</text>
  <text x="200" y="154" font-size="8" fill="#e8c8a0" text-anchor="end">$24,500</text>

  <rect x="35" y="162" width="110" height="16" rx="2" fill="#1a1007"/>
  <text x="40" y="174" font-size="7" fill="#D04A02">Box 2 — Net rental income</text>
  <text x="200" y="174" font-size="8" fill="#e8c8a0" text-anchor="end">$3,200</text>

  <rect x="35" y="182" width="110" height="16" rx="2" fill="#1a1007"/>
  <text x="40" y="194" font-size="7" fill="#D04A02">Box 5 — Interest income</text>
  <text x="200" y="194" font-size="8" fill="#e8c8a0" text-anchor="end">$840</text>

  <rect x="35" y="202" width="110" height="16" rx="2" fill="#2a1007" stroke="#D04A02" stroke-width="0.5"/>
  <text x="40" y="214" font-size="7" fill="#ff6b35">Box 20Z — QBI deduction ⚠</text>
  <text x="200" y="214" font-size="8" fill="#ff6b35" text-anchor="end">$4,900</text>

  <rect x="35" y="222" width="110" height="16" rx="2" fill="#1a1007"/>
  <text x="40" y="234" font-size="7" fill="#D04A02">Box 13W — Other deductions</text>
  <text x="200" y="234" font-size="8" fill="#e8c8a0" text-anchor="end">$1,100</text>

  <!-- Partner info -->
  <rect x="35" y="248" width="230" height="1" fill="#2a1a0a"/>
  <text x="35" y="262" font-size="7" fill="#7a5030">Partner: Carlos N. González López</text>
  <text x="35" y="274" font-size="7" fill="#7a5030">Ownership: 12.5% · EIN: **-***4521</text>

  <!-- Upload button -->
  <rect x="20" y="284" width="260" height="28" rx="3" fill="#1a1007" stroke="#D04A02" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="150" y="302" font-size="9" fill="#D04A02" text-anchor="middle">↑ Upload your K-1 PDF</text>

  <!-- K-3 indicator -->
  <rect x="20" y="322" width="126" height="24" rx="3" fill="#D04A02" opacity="0.12" stroke="#D04A02" stroke-width="0.5"/>
  <text x="83" y="338" font-size="9" fill="#D04A02" text-anchor="middle">K-3 Detected ✓</text>
  <rect x="154" y="322" width="126" height="24" rx="3" fill="#1a1007"/>
  <text x="217" y="338" font-size="9" fill="#7a5030" text-anchor="middle">Tax Year: 2024</text>

  <!-- Alert -->
  <rect x="20" y="358" width="260" height="44" rx="3" fill="#200a00" stroke="#D04A02" stroke-width="0.5"/>
  <text x="35" y="374" font-size="8" fill="#ff6b35">⚠ Box 20Z requires Form 8995</text>
  <text x="35" y="388" font-size="8" fill="#7a5030">QBI deduction — attach additional schedule</text>

  <rect x="20" y="414" width="260" height="36" rx="4" fill="#D04A02"/>
  <text x="150" y="437" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">ASK ASSISTANT →</text>

  <!-- Divider -->
  <rect x="300" y="44" width="1" height="456" fill="#2a1a0a"/>

  <!-- Right panel — Chat -->
  <rect x="301" y="44" width="499" height="456" fill="#0f0a07"/>
  <rect x="301" y="44" width="499" height="40" fill="#160d07"/>
  <rect x="315" y="56" width="8" height="8" rx="4" fill="#D04A02"/>
  <text x="332" y="67" font-size="10" fill="#e8c8a0">K-1 Tax Assistant</text>
  <text x="332" y="78" font-size="8" fill="#7a5030">PwC-trained · IRS compliant guidance</text>

  <!-- User message 1 -->
  <rect x="360" y="100" width="415" height="30" rx="4" fill="#D04A02" opacity="0.12" stroke="#D04A02" stroke-width="0.5"/>
  <text x="375" y="119" font-size="9" fill="#e8c8a0">What does Box 20Z mean and what do I need to do?</text>

  <!-- Agent response 1 -->
  <rect x="315" y="144" width="460" height="90" rx="4" fill="#160d07" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="315" y="144" width="3" height="90" fill="#D04A02" rx="2"/>
  <text x="328" y="162" font-size="9" fill="#D04A02" letter-spacing="1">BOX 20Z — QBI DEDUCTION COMPONENT</text>
  <text x="328" y="178" font-size="9" fill="#e8c8a0">Box 20Z reports your share of Qualified Business Income (QBI)</text>
  <text x="328" y="192" font-size="9" fill="#e8c8a0">from the partnership. You may deduct up to 20% of this amount</text>
  <text x="328" y="206" font-size="9" fill="#e8c8a0">on your personal return (Form 1040, Line 13).</text>
  <text x="328" y="222" font-size="9" fill="#7a5030">→ Attach Form 8995 or 8995-A · IRC §199A · IRS Pub. 535</text>

  <!-- Agent response 2 -->
  <rect x="315" y="248" width="460" height="60" rx="4" fill="#200a00" stroke="#D04A02" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="315" y="248" width="3" height="60" fill="#ff6b35" rx="2"/>
  <text x="328" y="266" font-size="9" fill="#ff6b35" letter-spacing="1">ACTION REQUIRED</text>
  <text x="328" y="282" font-size="9" fill="#e8c8a0">Your $4,900 QBI amount requires Form 8995 (simplified) since your</text>
  <text x="328" y="296" font-size="9" fill="#e8c8a0">taxable income is likely below the threshold. File before April 15.</text>

  <!-- User message 2 -->
  <rect x="360" y="322" width="415" height="30" rx="4" fill="#D04A02" opacity="0.12" stroke="#D04A02" stroke-width="0.5"/>
  <text x="375" y="341" font-size="9" fill="#e8c8a0">Where does Box 1 ordinary income go on my Form 1040?</text>

  <!-- Typing -->
  <rect x="315" y="366" width="120" height="30" rx="4" fill="#160d07" stroke="#2a1a0a" stroke-width="1"/>
  <rect x="315" y="366" width="3" height="30" fill="#D04A02" rx="2"/>
  <circle cx="340" cy="381" r="3" fill="#D04A02" opacity="0.4"/>
  <circle cx="352" cy="381" r="3" fill="#D04A02" opacity="0.7"/>
  <circle cx="364" cy="381" r="3" fill="#D04A02"/>

  <!-- Input bar -->
  <rect x="315" y="414" width="460" height="40" rx="4" fill="#160d07" stroke="#2a1a0a" stroke-width="1"/>
  <text x="332" y="438" font-size="9" fill="#7a5030">Ask about any Box, inconsistency, or where values go on your 1040...</text>
  <rect x="750" y="424" width="18" height="20" rx="3" fill="#D04A02"/>
  <text x="759" y="438" font-size="10" fill="#fff" text-anchor="middle">↑</text>
</svg>
