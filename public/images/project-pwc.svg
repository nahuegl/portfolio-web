<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg-pwc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0800"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D04A02;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#D04A02;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#D04A02;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg-pwc)"/>

  <!-- Subtle grid -->
  <pattern id="grid-pwc" width="40" height="40" patternUnits="userSpaceOnUse">
    <line x1="40" y1="0" x2="40" y2="40" stroke="#D04A02" stroke-width="0.3" stroke-opacity="0.08"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#D04A02" stroke-width="0.3" stroke-opacity="0.08"/>
  </pattern>
  <rect width="800" height="420" fill="url(#grid-pwc)"/>

  <!-- Browser frame -->
  <rect x="50" y="40" width="540" height="340" rx="4" fill="#0a0a0a" stroke="#2D2D2D" stroke-width="1"/>
  <!-- Browser bar -->
  <rect x="50" y="40" width="540" height="32" rx="4" fill="#1a1a1a"/>
  <rect x="50" y="56" width="540" height="16" fill="#1a1a1a"/>
  <!-- Browser dots -->
  <circle cx="70" cy="56" r="5" fill="#D04A02" opacity="0.9"/>
  <circle cx="86" cy="56" r="5" fill="#E0301E" opacity="0.7"/>
  <circle cx="102" cy="56" r="5" fill="#404041" opacity="0.9"/>
  <!-- URL bar -->
  <rect x="120" y="49" width="360" height="14" rx="2" fill="#2D2D2D"/>
  <text x="135" y="60" font-family="monospace" font-size="8" fill="#D04A02" opacity="0.8">pwc-redesign.vercel.app</text>

  <!-- Nav PwC -->
  <rect x="50" y="72" width="540" height="44" fill="#FFFFFF" opacity="0.96"/>
  <text x="72" y="100" font-family="serif" font-size="16" font-weight="bold" fill="#D04A02">PwC</text>
  <text x="370" y="99" font-family="sans-serif" font-size="8" fill="#404041">Servicios</text>
  <text x="420" y="99" font-family="sans-serif" font-size="8" fill="#404041">Industrias</text>
  <text x="472" y="99" font-family="sans-serif" font-size="8" fill="#404041">Nosotros</text>
  <text x="520" y="99" font-family="sans-serif" font-size="8" fill="#D04A02">Contacto →</text>

  <!-- Hero section -->
  <rect x="50" y="116" width="540" height="160" fill="#F3F3F3"/>
  <!-- Orange accent bar -->
  <rect x="50" y="116" width="4" height="160" fill="#D04A02"/>
  <!-- Hero content -->
  <text x="80" y="152" font-family="serif" font-size="22" font-weight="bold" fill="#2D2D2D">Construimos</text>
  <text x="80" y="176" font-family="serif" font-size="22" font-weight="bold" fill="#2D2D2D">confianza.</text>
  <rect x="80" y="186" width="120" height="2" fill="#D04A02"/>
  <text x="80" y="206" font-family="sans-serif" font-size="9" fill="#404041" opacity="0.7">Asesoramiento estratégico para empresas</text>
  <text x="80" y="218" font-family="sans-serif" font-size="9" fill="#404041" opacity="0.7">líderes en Argentina y la región.</text>
  <!-- CTA button -->
  <rect x="80" y="232" width="100" height="26" fill="#D04A02" rx="0"/>
  <text x="130" y="249" font-family="sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Conocé más →</text>
  <!-- Hero image placeholder -->
  <rect x="380" y="120" width="200" height="152" fill="#E0E0E0"/>
  <rect x="420" y="148" width="120" height="80" fill="#D04A02" opacity="0.15"/>
  <text x="480" y="196" font-family="sans-serif" font-size="8" fill="#D04A02" text-anchor="middle" opacity="0.5">[ hero visual ]</text>

  <!-- Stats bar -->
  <rect x="50" y="276" width="540" height="56" fill="#2D2D2D"/>
  <text x="100" y="298" font-family="serif" font-size="18" font-weight="bold" fill="#D04A02" text-anchor="middle">+40</text>
  <text x="100" y="314" font-family="sans-serif" font-size="7" fill="#F3F3F3" text-anchor="middle" opacity="0.6">años de experiencia</text>
  <line x1="180" y1="282" x2="180" y2="326" stroke="#404041" stroke-width="0.5"/>
  <text x="230" y="298" font-family="serif" font-size="18" font-weight="bold" fill="#D04A02" text-anchor="middle">3.000+</text>
  <text x="230" y="314" font-family="sans-serif" font-size="7" fill="#F3F3F3" text-anchor="middle" opacity="0.6">profesionales</text>
  <line x1="310" y1="282" x2="310" y2="326" stroke="#404041" stroke-width="0.5"/>
  <text x="360" y="298" font-family="serif" font-size="18" font-weight="bold" fill="#D04A02" text-anchor="middle">Top 4</text>
  <text x="360" y="314" font-family="sans-serif" font-size="7" fill="#F3F3F3" text-anchor="middle" opacity="0.6">Big Four en Argentina</text>

  <!-- Bottom bar -->
  <rect x="50" y="332" width="540" height="48" fill="#0a0a0a"/>
  <text x="72" y="356" font-family="monospace" font-size="7" fill="#D04A02" opacity="0.5">// scroll-trigger animations · dark/light · bilingual</text>
  <rect x="72" y="362" width="44" height="10" rx="1" fill="#D04A02" fill-opacity="0.1" stroke="#D04A02" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="94" y="370" font-family="monospace" font-size="6" fill="#D04A02" text-anchor="middle">Next.js 15</text>
  <rect x="124" y="362" width="32" height="10" rx="1" fill="#D04A02" fill-opacity="0.1" stroke="#D04A02" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="140" y="370" font-family="monospace" font-size="6" fill="#D04A02" text-anchor="middle">GSAP</text>
  <rect x="164" y="362" width="30" height="10" rx="1" fill="#D04A02" fill-opacity="0.1" stroke="#D04A02" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="179" y="370" font-family="monospace" font-size="6" fill="#D04A02" text-anchor="middle">Lenis</text>

  <!-- Side panel -->
  <rect x="618" y="40" width="132" height="340" rx="2" fill="#0f0f0f" stroke="#2D2D2D" stroke-width="1"/>
  <rect x="618" y="40" width="132" height="3" fill="#D04A02"/>
  <text x="628" y="65" font-family="monospace" font-size="7" fill="#D04A02" opacity="0.6">// PwC Redesign</text>
  <text x="628" y="82" font-family="monospace" font-size="7" fill="#404041">type: corporativo</text>
  <text x="628" y="96" font-family="monospace" font-size="7" fill="#404041">stack: Next 15</text>
  <text x="628" y="110" font-family="monospace" font-size="7" fill="#D04A02" opacity="0.7">motion: GSAP</text>
  <text x="628" y="124" font-family="monospace" font-size="7" fill="#404041">scroll: Lenis</text>
  <text x="628" y="138" font-family="monospace" font-size="7" fill="#D04A02" opacity="0.5">i18n: ES / EN</text>
  <line x1="628" y1="150" x2="740" y2="150" stroke="#2D2D2D" stroke-width="0.5"/>
  <text x="628" y="166" font-family="monospace" font-size="6" fill="#D04A02" opacity="0.4">// design tokens</text>
  <rect x="628" y="174" width="14" height="14" fill="#D04A02"/>
  <rect x="648" y="174" width="14" height="14" fill="#E0301E"/>
  <rect x="668" y="174" width="14" height="14" fill="#2D2D2D"/>
  <rect x="688" y="174" width="14" height="14" fill="#F3F3F3" stroke="#404041" stroke-width="0.5"/>

  <!-- Glow line -->
  <rect x="0" y="209" width="800" height="1" fill="url(#glowOrange)" opacity="0.4"/>

  <!-- Label -->
  <text x="590" y="410" font-family="monospace" font-size="9" fill="#D04A02" opacity="0.4" text-anchor="end">PwC Redesign — Next.js 15 · GSAP · Lenis</text>
</svg>
